name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # ubuntu-latest comes with make and shellcheck.
      - run: scripts/install-pandoc.sh
      - run: PATH="$PWD/.pandoc/bin:$PATH" make check
